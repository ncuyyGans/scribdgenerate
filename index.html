<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Link Embed Scribd</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Generate Link Embed Scribd</h1>
        <p>Masukkan link dokumen Scribd Anda di bawah ini:</p>
        <input type="text" id="scribdLinkInput" placeholder="Contoh: https://id.scribd.com/document/424114543/...">
        <button id="generateButton">Generate Link</button>
        
        <div id="resultArea" style="display: none;">
            <h3>Link Hasil Generate:</h3>
            <p id="generatedLinkOutput"></p>
            <button id="openNewTabButton">Buka Link Baru</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
